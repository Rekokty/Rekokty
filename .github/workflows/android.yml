name: Android APK
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk wspolny-jadlospis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wspolny-jadlospis-apk
          path: wspolny-jadlospis.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --cleanup-tag --yes || true
          gh release create apk wspolny-jadlospis.apk --target "$GITHUB_SHA" --title "Wspólny Jadłospis (build ${{ github.run_number }})" --notes "Pobierz plik wspolny-jadlospis.apk na telefon z Androidem i otwórz go, żeby zainstalować."
