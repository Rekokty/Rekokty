<meta charset="utf-8">
<title>Amku Amku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Układ: wąski nagłówek, przyklejone trzy zakładki, pod nimi jedna kolumna na telefonie i siatka dni na szerokim ekranie. */
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --ink:#1B2620; --muted:#5C6A62; --line:#D8DFD7;
  --beet:#A0174F; --beet-soft:#F7E4EC; --on-beet:#FFFFFF;
  --leaf:#2B774A; --leaf-soft:#DFF0E4; --warn:#8A5A00; --warn-soft:#FBEFD2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131915; --surface:#1C2420; --ink:#E8EEE9; --muted:#9BA9A0; --line:#2E3A33;
    --beet:#F27AAA; --beet-soft:#3B1D2B; --on-beet:#22060F;
    --leaf:#72C893; --leaf-soft:#1C3326; --warn:#F0C566; --warn-soft:#3A2F12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1C2420; --ink:#E8EEE9; --muted:#9BA9A0; --line:#2E3A33;
  --beet:#F27AAA; --beet-soft:#3B1D2B; --on-beet:#22060F;
  --leaf:#72C893; --leaf-soft:#1C3326; --warn:#F0C566; --warn-soft:#3A2F12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-block:20px 10px}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:-.02em;margin:0;line-height:1.1}
h1 span{color:var(--beet)}
.pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf)}
.pill.local{background:var(--warn-soft);color:var(--warn)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px}
nav button{flex:1;max-width:200px;font:600 .86rem var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:12px 2px 9px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--beet);border-bottom-color:var(--beet)}
main.wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--beet);outline-offset:2px}
.btn{font:600 .95rem var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer}
.btn.primary{background:var(--beet);border-color:var(--beet);color:var(--on-beet)}
.btn.small{padding:6px 12px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.92rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
h2{font-family:var(--display);font-size:1.25rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}

/* Jadłospis */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.day>header{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day>header b{font-family:var(--display);font-size:1.08rem;text-transform:capitalize}
.meal{border-top:1px solid var(--line)}
.meal summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.meal summary::-webkit-details-marker{display:none}
.meal .slot{grid-column:1/-1;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--beet);font-weight:700}
.meal .name{font-weight:600;min-width:0}
.meal .who{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.chip.sm{padding:4px 10px;font-size:.84rem}
.meal .chev{color:var(--muted);font-size:.8rem;transition:transform .15s}
.meal[open] .chev{transform:rotate(180deg)}
.meal .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 0 5px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal}
th{font-size:.74rem;color:var(--muted);font-weight:600}
.day>footer{border-top:1px solid var(--line);padding:9px 14px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.day>footer b{color:var(--ink);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Zakupy */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .2s}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);min-height:44px}
.items li:first-child{border-top:0}
.items label{flex:1;display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;min-width:0}
.items input[type=checkbox]{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.items .n{flex:1;min-width:0;overflow-wrap:anywhere}
.items .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.92rem}
.items li.done .n{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;padding:8px;cursor:pointer;border-radius:8px}
input[type=text],input[type=password],input[type=number],input[type=date],select{font-size:1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.grow{flex:1 1 160px}

/* Ustawienia */
.form{display:flex;flex-direction:column;gap:18px;max-width:640px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:600;font-size:.92rem}
.person{display:flex;gap:8px;align-items:center}
.person input[type=number]{width:88px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chip{color:var(--ink);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.92rem;cursor:pointer}
.chip input{accent-color:var(--beet)}
.chip.on{background:var(--beet-soft);border-color:var(--beet);color:var(--beet)}
.chip button{border:0;background:none;color:inherit;font-size:1rem;cursor:pointer;padding:0 0 0 2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
textarea{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:84px;resize:vertical}
.ritem{display:grid;grid-template-columns:1fr 1fr auto;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ritem .full{grid-column:1/-1}
.ritem label{display:flex;align-items:center;gap:6px;min-width:0;font-size:.82rem;color:var(--muted);white-space:nowrap}
.ritem label input{width:100%}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border-radius:10px;padding:12px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
.calc .full{grid-column:1/-1}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}
.rlist li>div{flex:1;min-width:0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daynav b{font-family:var(--display);font-size:1.15rem;text-transform:capitalize;text-align:center;flex:1}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--display);font-size:1.3rem}
.bar.over i{background:var(--beet)}
.items .n small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--beet);font-weight:700}
tr.cur td{font-weight:700}
tbody tr.pick{cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function mkRecipe(id,slot,name,ing,how){
  let kcal=0,flags="";
  for(const k in ing){kcal+=ING[k][2]*ing[k]/100;for(const f of ING[k][6])if(!flags.includes(f))flags+=f}
  return {id,slot,name,ing,how,kcal,flags};
}
const R=Object.fromEntries(RECIPES.map(r=>[r.id,r]));

/* ---------- Własne przepisy (wpisane ręcznie albo odczytane ze zdjęcia) ---------- */
const BASE_ING=Object.keys(ING),BASE_N=RECIPES.length;
const slug=s=>s.toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40)||"x";
const numIn=(v,a,b)=>Math.min(b,Math.max(a,+v||0));
/* Czyści jeden składnik pochodzący z bazy albo z odpowiedzi Claude. */
function cleanItem(x){
  if(!x||typeof x!=="object")return null;
  const g=Math.round(numIn(x.g,0,2000));if(g<1)return null;
  const k=BASE_ING.includes(x.k)?x.k:BASE_ING.includes(x.id)?x.id:null;
  if(k){const i=ING[k];return{k,name:i[0],g,kcal:i[2],b:i[3],t:i[4],w:i[5],cat:i[1],flags:i[6]}}
  const name=String(x.name||"").trim().slice(0,40);if(!name)return null;
  const flags=typeof x.flags==="string"?[...x.flags].filter((c,i,a)=>"mgd".includes(c)&&a.indexOf(c)===i).join(""):(x.meat?"m":"")+(x.gluten?"g":"")+(x.lactose?"d":"");
  return{name,g,kcal:Math.round(numIn(x.kcal,0,900)),b:numIn(x.b,0,100),t:numIn(x.t,0,100),w:numIn(x.w,0,100),cat:["w","n","m","z","s"].includes(x.cat)?x.cat:"s",flags};
}
function cleanRecipe(o){
  if(!o||typeof o!=="object"||!Array.isArray(o.items))return null;
  const items=o.items.slice(0,25).map(cleanItem).filter(Boolean);
  if(!items.length)return null;
  return{name:String(o.name||"Nowy przepis").trim().slice(0,60)||"Nowy przepis",slot:["S","O","P","K"].includes(o.slot)?o.slot:"O",how:String(o.how||"").slice(0,600),at:+o.at||0,items};
}
const itemsKcal=items=>items.reduce((a,it)=>a+numIn(it.kcal,0,900)*numIn(it.g,0,2000)/100,0);
function applyCustom(list){
  for(const k in ING)if(k.startsWith("c_"))delete ING[k];
  for(const k in R)if(k.startsWith("u_"))delete R[k];
  RECIPES.length=BASE_N;
  for(const c of list){
    const ing={};
    for(const it of c.items){let k=it.k;if(!k){k="c_"+slug(it.name);ING[k]=[it.name,it.cat,it.kcal,it.b,it.t,it.w,it.flags]}ing[k]=(ing[k]||0)+it.g}
    const r=mkRecipe("u_"+c.id,c.slot,c.name,ing,c.how);
    if(r.kcal<20)continue;
    r.custom=true;RECIPES.push(r);R[r.id]=r;
  }
}

const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const newId=()=>Math.random().toString(36).slice(2,8)||"p";
const mkPerson=(name,kcal)=>({id:newId(),name,kcal,eats:{S:true,O:true,P:true,K:true},wd:false});
function defaults(){return{people:[mkPerson("Osoba 1",2000),mkPerson("Osoba 2",2500)],diet:{noMeat:false,noGluten:false,noLactose:false},exclude:[],nDays:7,cook:1,start:todayISO()}}
/* Dane z bazy są współdzielone, więc każdy odczyt przechodzi przez normalizację. */
function norm(p){
  if(!p||typeof p!=="object")return null;
  const d=defaults();
  const people=(Array.isArray(p.people)?p.people:[]).slice(0,8).map((x,i)=>{x=x||{};const e=x.eats&&typeof x.eats==="object"?x.eats:{};
    return{id:typeof x.id==="string"&&/^[A-Za-z0-9]{1,12}$/.test(x.id)?x.id:"p"+i,name:String(x.name||"Osoba "+(i+1)).slice(0,30),kcal:clamp(Math.round(+x.kcal)||2000,1000,5000),
      eats:{S:e.S!==false,O:e.O!==false,P:e.P!==false,K:e.K!==false},wd:!!x.wd}});
  const out={
    people:people.length?people:d.people,
    diet:{noMeat:!!(p.diet&&p.diet.noMeat),noGluten:!!(p.diet&&p.diet.noGluten),noLactose:!!(p.diet&&p.diet.noLactose)},
    exclude:(Array.isArray(p.exclude)?p.exclude:[]).filter(k=>ING[k]),
    nDays:clamp(Math.round(+p.nDays)||7,1,14),
    cook:clamp(Math.round(+p.cook)||1,1,3),
    start:/^\d{4}-\d\d-\d\d$/.test(p.start)?p.start:d.start,
    days:[]
  };
  for(const day of Array.isArray(p.days)?p.days.slice(0,14):[]){
    const o={},ov={};for(const [s] of SLOTS){const r=R[day&&day[s]];if(r&&r.slot===s)o[s]=r.id;
      const m=day&&day.ov&&day.ov[s];if(m&&typeof m==="object"){const c={};for(const k in m)if(/^[A-Za-z0-9]{1,12}$/.test(k)&&typeof m[k]==="boolean")c[k]=m[k];if(Object.keys(c).length)ov[s]=c}}
    if(Object.keys(ov).length)o.ov=ov;
    out.days.push(o);
  }
  return out;
}
function allowed(r,p){
  if(r.gone)return false;
  if(p.diet.noMeat&&r.flags.includes("m"))return false;
  if(p.diet.noGluten&&r.flags.includes("g"))return false;
  if(p.diet.noLactose&&r.flags.includes("d"))return false;
  return !p.exclude.some(k=>k in r.ing);
}
function pick(slot,p,dayIdx,except){
  const pool=RECIPES.filter(r=>r.slot===slot&&allowed(r,p));
  if(!pool.length)return null;
  const used=new Set(p.days.map(d=>d[slot]));
  const near=new Set([p.days[dayIdx-1]&&p.days[dayIdx-1][slot],p.days[dayIdx+1]&&p.days[dayIdx+1][slot],except]);
  let c=pool.filter(r=>!used.has(r.id)&&!near.has(r.id));
  if(!c.length)c=pool.filter(r=>!near.has(r.id));
  if(!c.length)c=pool.filter(r=>r.id!==except);
  if(!c.length)c=pool;
  return c[Math.floor(Math.random()*c.length)].id;
}
/* Buduje jadłospis z ustawień. fresh=false zachowuje dania, które nadal pasują do diety. */
function buildPlan(settings,old,fresh){
  const p={...settings,days:[]};
  for(const [s,label] of SLOTS)if(!RECIPES.some(r=>r.slot===s&&allowed(r,p)))return{error:"Przy tych ograniczeniach nie ma żadnego dania na: "+label.toLowerCase()+". Usuń któreś wykluczenie."};
  for(let i=0;i<p.nDays;i++){
    const day={};p.days.push(day);
    if(!fresh&&old&&old.days[i]&&old.days[i].ov)day.ov=JSON.parse(JSON.stringify(old.days[i].ov));
    for(const [s] of SLOTS){
      const prev=!fresh&&old&&old.days[i]&&R[old.days[i][s]];
      if(prev&&allowed(prev,p))day[s]=prev.id;
    }
  }
  /* Obiad gotowany na kilka dni: kolejne dni bloku dostają to samo danie co dzień gotowania. */
  if(p.cook>1)for(let i=0;i<p.nDays;i++)if(i%p.cook)delete p.days[i].O;
  for(let i=0;i<p.nDays;i++)for(const [s] of SLOTS)if(!p.days[i][s])p.days[i][s]=s==="O"&&p.cook>1&&i%p.cook?p.days[cookDay(p,i)].O:pick(s,p,i);
  return{plan:p};
}
const factor=(person,slot,r)=>person.kcal*SLOTS.find(s=>s[0]===slot)[2]/r.kcal;
const num=(n,d=0)=>n.toLocaleString("pl-PL",{maximumFractionDigits:d});
function fmtPortion(k,g){
  const i=ING[k];
  if(i[7]==="szt"){const n=Math.max(.5,Math.round(g/i[8]*2)/2);return num(n,1)+" szt."}
  return num(Math.max(5,Math.round(g/5)*5))+" "+(i[7]||"g");
}
function fmtShop(k,g){
  const i=ING[k];
  if(i[7]==="szt")return Math.max(1,Math.ceil(g/i[8]-.05))+" szt.";
  const r=Math.ceil(g/10)*10,ml=i[7]==="ml";
  return r>=1000?num(r/1000,2)+(ml?" l":" kg"):r+(ml?" ml":" g");
}
const cookDay=(p,i)=>p.cook>1?i-i%p.cook:i;
/* Czy obiad dnia i pochodzi z gotowania w pierwszym dniu bloku (to samo danie). */
const leftover=(p,i)=>p.cook>1&&i%p.cook>0&&p.days[i].O===p.days[cookDay(p,i)].O;
const dateOf=(p,i)=>{const d=new Date(p.start+"T12:00:00");d.setDate(d.getDate()+i);return d};
/* Kto je dany posiłek: zmiana z jadłospisu na ten dzień wygrywa, potem ustawienia osoby (wyłączenia mogą dotyczyć tylko pon–pt). */
function eats(p,i,s,x){
  const day=p.days[i],o=day&&day.ov&&day.ov[s]&&day.ov[s][x.id];
  if(typeof o==="boolean")return o;
  if(x.eats[s])return true;
  if(x.wd){const wd=dateOf(p,i).getDay();return wd===0||wd===6}
  return false;
}
/* days: lista numerów dni albo null dla całego jadłospisu. */
function shopping(p,days){
  const t={};
  p.days.forEach((day,i)=>{
    for(const [s] of SLOTS){const r=R[day[s]];if(!r)continue;
      /* Składniki na obiad z kolejnych dni bloku kupuje się na dzień gotowania. */
      if(days&&!days.includes(s==="O"&&leftover(p,i)?cookDay(p,i):i))continue;
      for(const person of p.people){if(!eats(p,i,s,person))continue;const f=factor(person,s,r);for(const k in r.ing)t[k]=(t[k]||0)+r.ing[k]*f}}});
  return t;
}
const cleanDays=a=>Array.isArray(a)?[...new Set(a.filter(n=>Number.isInteger(n)&&n>=0&&n<14))].sort((x,y)=>x-y):[];
function shopDays(p){const d=state.shopDays.filter(i=>i<p.days.length);return d.length&&d.length<p.days.length?d:null}
function dayLabel(p,i){return dateOf(p,i).toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"numeric"})}
function dayShort(p,i){return dateOf(p,i).toLocaleDateString("pl-PL",{weekday:"short",day:"numeric",month:"numeric"})}
function dayMacros(p,i,person){
  let b=0,t=0,w=0,kcal=0;const day=p.days[i];
  for(const [s] of SLOTS){const r=R[day[s]];if(!r||!eats(p,i,s,person))continue;const f=factor(person,s,r);kcal+=r.kcal*f;
    for(const k in r.ing){const g=r.ing[k]*f/100;b+=ING[k][3]*g;t+=ING[k][4]*g;w+=ING[k][5]*g}}
  return{kcal,b,t,w};
}

const state={plan:null,rawPlan:null,custom:[],checks:{},shopDays:[],log:{},extras:[],ready:false,shared:false,canWrite:true,stale:false,ai:null,aiImages:null,app:false,fb:false,hid:"",aiKey:""};

const HID_KEY="wj-household",KEY_KEY="wj-ai-key",LOCAL_KEY="wspolny-jadlospis";
const deepMerge=(a,b)=>{for(const k in b){const v=b[k];a[k]=v&&typeof v==="object"&&!Array.isArray(v)?deepMerge(a[k]&&typeof a[k]==="object"?a[k]:{},v):v}return a};
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};

let fbDb=null;
async function fbInit(){
  if(fbDb)return fbDb;
  const fb=window.firebase;
  if(!fb.apps.length)fb.initializeApp(window.FIREBASE_CONFIG);
  const fs=fb.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  const auth=fb.auth();
  await new Promise(r=>{const un=auth.onAuthStateChanged(()=>{un();r()})});
  if(!auth.currentUser)await within(auth.signInAnonymously(),15000);
  return fbDb=fs;
}
/* Gdy konto anonimowe telefonu przestanie działać (np. usunięte w konsoli Firebase), aplikacja loguje się od nowa.
   Dostęp do domu daje kod, więc nowe konto niczego nie traci. Najwyżej raz na minutę, żeby nie zapętlić przeładowań. */
function reauth(){
  let last=0;try{last=+sessionStorage.getItem("wj-reauth")||0}catch(e){}
  if(Date.now()-last<60000)return false;
  try{sessionStorage.setItem("wj-reauth",String(Date.now()))}catch(e){return false}
  toast("Odświeżam połączenie…");
  const auth=window.firebase.auth();
  auth.signOut().catch(()=>{}).then(()=>auth.signInAnonymously()).then(()=>location.reload(),()=>{});
  return true;
}
function fbStore(fs,hid){
  const base=fs.collection("households").doc(hid),planRef=base.collection("app").doc("plan"),checksRef=base.collection("app").doc("checks"),extras=base.collection("extras"),recipes=base.collection("recipes");
  let gotPlan=false,gotRecipes=false;
  const authCodes=["permission-denied","unauthenticated"];
  const fail=e=>{
    const code=(e&&e.code)||"";
    console.warn("Zapis nieudany:",code,e&&e.message);
    if(code==="not-found")return; /* pozycję usunęła w międzyczasie druga osoba */
    if(authCodes.includes(code)){if(!reauth())toast("Brak dostępu do wspólnego domu. Sprawdź reguły w Firebase.");return}
    toast("Nie udało się zapisać (błąd: "+(code||"nieznany")+"). Spróbuj ponownie za chwilę.");
  };
  /* Zapisy nie czekają na siebie: bez internetu Firestore trzyma je w kolejce i wysyła później. */
  const run=fn=>{try{Promise.resolve(fn()).catch(fail)}catch(e){fail(e)}};
  /* Bez includeMetadataChanges Firestore nie zgłasza przejścia z pamięci podręcznej na serwer, gdy dane się nie zmieniły,
     więc aplikacja uznawałaby, że nie ma połączenia. */
  let waited=false;
  const timer=setTimeout(()=>{waited=true;state.stale=!live;state.ready=true;render()},10000);
  let live=false;
  const fresh=snap=>{live=!snap.metadata.fromCache;if(live){clearTimeout(timer);waited=true;state.stale=false}else if(waited)state.stale=true};

    aiNote=e&&e.code==="cancelled"?"":(e&&AI_ERR[e.code])||"Nie udało się odczytać przepisu. Spróbuj ponownie albo wpisz go ręcznie.";
  }
  aiBusy=false;render();
}
function saveRecipe(){
  const d=rdraft,name=d.name.trim().slice(0,60);
  const items=d.items.map(it=>{
    const nm=String(it.name).trim().slice(0,40),g=Math.round(numIn(it.g,0,2000));if(!nm||g<1)return null;
    const k=it.k||BASE_ING.find(b=>ING[b][0].toLowerCase()===nm.toLowerCase());
    return k?{k,g}:{name:nm,g,kcal:Math.round(numIn(it.kcal,0,900)),b:it.b,t:it.t,w:it.w,cat:it.cat,flags:it.flags};
  }).filter(Boolean);
  if(!name){rError="Wpisz nazwę przepisu.";return render()}
  if(!items.length||itemsKcal(d.items)<20){rError="Dodaj przynajmniej jeden składnik z ilością i kaloriami.";return render()}
  store.addRecipe({name,slot:d.slot,how:d.how.trim().slice(0,600),at:Date.now(),items});
  rdraft=null;rError="";aiNote="";toast("Zapisano przepis. Wybierz go w jadłospisie przy posiłku.");render();
}
function removeRecipe(c){
  const rid="u_"+c.id,p=state.plan;
  if(p&&R[rid]&&p.days.some(d=>SLOTS.some(([s])=>d[s]===rid))){
    const n={...planSettings(p),days:p.days.map(d=>({...d}))};R[rid].gone=true;
    n.days.forEach((d,i)=>{for(const [s] of SLOTS)if(d[s]===rid){const id=pick(s,n,i,rid);if(id)d[s]=id;else delete d[s]}});
    store.setPlan(n);
  }
  store.delRecipe(c.id);
}
function viewRecipes(){
  const w=state.canWrite,out=[];
  if(rdraft&&w){
    const d=rdraft,total=h("b",null,Math.round(itemsKcal(d.items))+" kcal");
    const re=()=>{total.textContent=Math.round(itemsKcal(d.items))+" kcal"};
    out.push(h("div",{class:"panel"},
      h("h2",null,"Nowy przepis"),
      aiNote&&h("div",{class:"note"},aiNote),
      h("label",{class:"field"},h("span",null,"Nazwa"),h("input",{type:"text",id:"r-name",value:d.name,maxLength:60,oninput:e=>{d.name=e.target.value}})),
      h("label",{class:"field"},h("span",null,"Posiłek"),h("select",{id:"r-slot",onchange:e=>{d.slot=e.target.value}},SLOTS.map(([s,l])=>h("option",{value:s,selected:d.slot===s},l)))),
      h("div",{class:"field"},h("span",null,"Składniki na jedną porcję"),
        d.items.map((it,i)=>h("div",{class:"ritem"},
          h("input",{type:"text",id:"ri-name-"+i,class:"full",value:it.name,maxLength:40,placeholder:"Nazwa produktu","aria-label":"Nazwa produktu",oninput:e=>{it.name=e.target.value;delete it.k}}),
          h("label",null,h("input",{type:"number",id:"ri-g-"+i,value:it.g,min:1,max:2000,"aria-label":"Gramy",oninput:e=>{it.g=e.target.value;re()}}),"g"),
          h("label",null,h("input",{type:"number",id:"ri-kcal-"+i,value:it.kcal,min:0,max:900,"aria-label":"Kalorie na 100 g",oninput:e=>{it.kcal=e.target.value;delete it.k;re()}}),"kcal/100 g"),
          h("button",{class:"x",type:"button","aria-label":"Usuń składnik",onclick:()=>{d.items.splice(i,1);render()}},"×"))),
        d.items.length<25&&h("div",null,h("button",{class:"btn small",type:"button",onclick:()=>{d.items.push(blankItem());render()}},"Dodaj składnik"))),
      h("label",{class:"field"},h("span",null,"Przygotowanie"),h("textarea",{id:"r-how",value:d.how,maxLength:600,oninput:e=>{d.how=e.target.value}})),
      h("div",null,"Jedna porcja: ",total,h("span",{class:"muted small"}," (jadłospis i tak przeliczy porcję na kalorie każdej osoby)")),
      rError&&h("div",{class:"note"},rError),
      h("div",{class:"row"},h("button",{class:"btn primary",type:"button",onclick:saveRecipe},"Zapisz przepis"),h("button",{class:"btn",type:"button",onclick:()=>{rdraft=null;rError="";aiNote="";render()}},"Anuluj"))));
  }else if(w){
    out.push(h("div",{class:"panel"},
      h("h2",null,"Dodaj własny przepis"),
      aiBusy?h("div",{class:"row"},h("span",null,"Odczytuję przepis… To może potrwać do minuty."),h("button",{class:"btn small",onclick:()=>aiCtl&&aiCtl.abort()},"Przerwij")):[
        aiNote&&h("div",{class:"note"},aiNote),
        state.ai&&state.aiImages&&h("div",null,
          h("div",{class:"row"},h("label",{class:"btn primary",for:state.app?"r-camera":"r-photo"},state.app?"Zrób zdjęcie przepisu":"Zeskanuj zdjęcie przepisu"),
            state.app&&h("label",{class:"btn",for:"r-photo"},"Wybierz z galerii")),
          state.app&&h("input",{type:"file",id:"r-camera",class:"vh",accept:"image/*",capture:"environment",onchange:e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)scan(f,"")}}),
          h("input",{type:"file",id:"r-photo",class:"vh",accept:(state.aiImages.mediaTypes||["image/*"]).join(","),onchange:e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)scan(f,"")}}),
          h("div",{class:"muted small",style:"margin-top:6px"},"Zrób zdjęcie strony z książki, kartki albo zrzut ekranu. Claude odczyta tekst, wybierze składniki i policzy kalorie.")),
        state.ai&&h("div",{class:"field"},h("span",null,state.aiImages?"Albo wklej tekst przepisu":"Wklej tekst przepisu"),
          h("textarea",{id:"r-text",placeholder:"Np. skopiowany ze strony z przepisami",maxLength:6000}),
          h("div",null,h("button",{class:"btn",type:"button",onclick:()=>{const t=$("r-text").value.trim();if(t.length<15){aiNote="Wklej najpierw tekst przepisu.";return render()}scan(null,t)}},"Odczytaj składniki"))),
        !state.ai&&h("div",{class:"muted small"},state.app?"Żeby skanować zdjęcia przepisów, wpisz klucz API w zakładce Dieta. Bez niego możesz wpisać przepis ręcznie.":"Skanowanie zdjęć działa, gdy strona jest otwarta w aplikacji Claude i wyrazisz zgodę na użycie Claude. Tutaj możesz wpisać przepis ręcznie."),
        h("div",null,h("button",{class:"btn",type:"button",onclick:()=>{rdraft={name:"",slot:"O",how:"",items:[blankItem()]};aiNote="";render()}},"Wpisz ręcznie"))]));
  }
  out.push(h("div",{class:"panel"},h("h2",null,"Wasze przepisy"),
    state.custom.length?h("ul",{class:"rlist"},state.custom.map(c=>h("li",null,
      h("div",null,h("b",null,c.name),h("div",{class:"muted small"},SLOTS.find(s=>s[0]===c.slot)[1]+" · "+Math.round(itemsKcal(c.items))+" kcal na porcję"),h("div",{class:"small"},c.items.map(it=>it.name+" "+it.g+" g").join(", "))),
      w&&h("button",{class:"btn small",type:"button",onclick:()=>{if(armedDel!==c.id){armedDel=c.id;render();setTimeout(()=>{if(armedDel===c.id){armedDel="";if(!typing())render()}},4000);return}armedDel="";removeRecipe(c)}},armedDel===c.id?"Na pewno?":"Usuń")))):
      h("p",{class:"muted",style:"margin:0"},"Nie ma jeszcze własnych przepisów. Dodane tutaj dania trafiają do losowania jadłospisu i można je wybrać przy każdym posiłku (oznaczone gwiazdką)."),
    h("p",{class:"muted small",style:"margin:0"},"Oprócz nich program ma "+BASE_N+" wbudowanych dań.")));
  return out;
}
for(const b of document.querySelectorAll("nav button"))b.addEventListener("click",()=>setTab(b.dataset.tab));
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t&&t!==tab)setTab(t)});
if(["dziennik","zakupy","przepisy","dieta"].includes(location.hash.slice(1)))tab=location.hash.slice(1);
$("status").addEventListener("click",()=>{if(!state.app)return;setTab("dieta");const p=$("share-panel");if(p)p.scrollIntoView({block:"center"})});
render();connect();
</script>
